      function setCategory(category, btn) {
        selectedCategory = category;
        shownUlam = [];
        document
          .querySelectorAll(".cat-btn")
          .forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("ulam-name").innerText = "Ready na!";
      }

      function generateUlam() {
        const displayImg = document.getElementById("ulam-image");
        const displayName = document.getElementById("ulam-name");

        let filteredList =
          selectedCategory === "All"
            ? ulamList
            : ulamList.filter((item) => item.type === selectedCategory);
        let remainingUlam = filteredList.filter(
          (item) => !shownUlam.includes(item.name),
        );

        if (remainingUlam.length === 0) {
          shownUlam = [];
          remainingUlam = filteredList;
        }

        const randomIndex = Math.floor(Math.random() * remainingUlam.length);
        const selectedUlam = remainingUlam[randomIndex];

        shownUlam.push(selectedUlam.name);

        displayName.innerText = selectedUlam.name;
        displayImg.style.backgroundImage = `url('${selectedUlam.img}')`;

        setTimeout(() => {
          showRecipe(selectedUlam);
        }, 500);
      }

      function showRecipe(ulam) {
        const modal = document.getElementById("recipe-modal");
        if (modal) {
          document.getElementById("recipe-title").innerText = ulam.name;
          const ingList = document.getElementById("ingredients-list");
          const stepList = document.getElementById("steps-list");

          ingList.innerHTML = ulam.ingredients
            ? ulam.ingredients.map((i) => `<li>${i}</li>`).join("")
            : "<li>Ingredients soon...</li>";
          stepList.innerHTML = ulam.steps
            ? ulam.steps.map((s) => `<li>${s}</li>`).join("")
            : "<li>Steps soon...</li>";

          modal.style.display = "flex";
        }
      }

      function closeModal() {
        document.getElementById("recipe-modal").style.display = "none";
      }

      window.onclick = (e) => {
        const modal = document.getElementById("recipe-modal");
        if (e.target == modal) closeModal();
      };
